<style>
/* Layout: a terminal research note. One reading column (840px) for prose, tables and charts
   break out to 1120px. Committed single dark world to match the Clive terminal. */
:root {
  color-scheme: dark;
  --bg: #050607;
  --panel: #0b0e11;
  --rule: #222a31;
  --amber: #ffa028;
  --amber-dim: #9a6214;
  --ink: #e9ebe6;
  --text: #c3c8c3;
  --dim: #7f8890;
  --pos: #3ddc84;
  --neg: #ff5a52;
  --warn: #ffd23f;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.62 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
.top { border-bottom: 1px solid var(--rule); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  font: 600 12px var(--f-mono); letter-spacing: 0.06em; color: var(--dim); max-width: 1120px; margin: 0 auto; }
.top .brand { background: var(--amber); color: #000; padding: 2px 8px; letter-spacing: 0.12em; }
.top .fn { color: var(--amber); }
main { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px; padding-top: 40px; }
.col { max-width: 840px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; color: var(--ink); text-wrap: balance; }
h1 { font: 700 clamp(30px, 5vw, 44px)/1.08 var(--f-mono); letter-spacing: -0.02em; }
h2 { font: 700 22px/1.2 var(--f-mono); }
h3 { font: 600 16px/1.3 var(--f-mono); color: var(--amber); letter-spacing: 0.02em; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font: 600 11px var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
.lede { font-size: 19px; color: var(--ink); max-width: 62ch; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
code { color: var(--amber); }
ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; max-width: 72ch; }
li::marker { color: var(--amber-dim); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .dim { color: var(--dim); }

.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.verdicts > div { background: var(--panel); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.verdicts b { font: 700 15px var(--f-mono); color: var(--ink); }
.verdicts p { font-size: 14px; }

.pill { display: inline-block; font: 700 10px/1 var(--f-mono); letter-spacing: 0.08em; padding: 4px 7px; border: 1px solid currentColor; white-space: nowrap; vertical-align: 2px; }
.pill.go { color: var(--pos); } .pill.watch { color: var(--warn); } .pill.no { color: var(--neg); } .pill.info { color: var(--dim); }

.scroll { overflow-x: auto; border: 1px solid var(--rule); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font: 13px/1.45 var(--f-mono); font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid #151b20; vertical-align: top; }
th { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); border-bottom: 1px solid var(--amber-dim); white-space: nowrap; }
td { color: var(--ink); }
td.n, th.n { text-align: right; white-space: nowrap; }
td.why { color: var(--text); font-family: var(--f-body); font-size: 13px; min-width: 240px; }
tr:last-child td { border-bottom: 0; }
caption { caption-side: bottom; text-align: left; padding: 8px 12px; font: 12px var(--f-body); color: var(--dim); }

figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figure img { width: 100%; height: auto; display: block; border: 1px solid var(--rule); }
figcaption { font-size: 13px; color: var(--dim); max-width: 80ch; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }

.callout { border-left: 3px solid var(--amber); background: var(--panel); padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 840px; }
.callout.red { border-left-color: var(--neg); }
.steps { counter-reset: s; list-style: none; padding: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 2.2em 1fr; gap: 4px; }
.steps li::before { content: counter(s) "."; font: 700 14px var(--f-mono); color: var(--amber); }
footer { max-width: 1120px; margin: 0 auto; border-top: 1px solid var(--rule); padding-top: 14px; font-size: 13px; color: var(--dim); }
@media (max-width: 520px) { .figs { grid-template-columns: 1fr; } td.why { min-width: 180px; } }
</style>
